<style>

 0}.barrow{display:grid;grid-template-columns:84px 1fr 30px;align-items:center;gap:8px;font-size:.9rem}.track{height:10px;background:#edf0e8;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8cb78d,#4f805f);border-radius:20px}.note{padding:13px 15px;background:#fff8e9;border:1px solid #f1e3c2;border-radius:14px;margin-top:10px}.shopping-group{margin:15px 0}.shopping-group h3{margin:0 0 6px;color:var(--green);font-size:1rem}.shopitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f1eb}.shopitem input{accent-color:var(--green);width:19px;height:19px}.shopitem:has(input:checked) span{text-decoration:line-through;color:#96a095}.recipe{padding:16px;border-radius:16px;background:#fbfaf5;margin-top:12px}.recipe h3{margin:0 0 6px}.recipe h4{margin:12px 0 4px}.recipe ul,.recipe ol{margin:4px 0;padding-left:22px}.fine{font-size:.76rem;color:var(--muted);margin-top:18px}.progress{height:5px;background:#e5eadf;border-radius:9px;margin:8px 0 4px;overflow:hidden}.progress span{display:block;background:#74a17c;height:100%;transition:width .2s}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263b31;color:white;padding:10px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:5}@media(min-width:650px){.days{grid-template-columns:1fr 1fr}.day.full{grid-column:1/-1}.hero{padding:38px}.mascot{height:150px}}@media(max-width:380px){.grid{grid-template-columns:1fr}.panel{padding:19px}.actions{gap:7px}.btn{padding:11px 12px}}

{name:'鶏むね肉の香味焼き定食',protein:'鶏肉',kind:'肉',foods:['鶏肉','キャベツ','にんじん','ごはん'],time:25,recipe:['鶏むね肉 1枚','キャベツ 1/6玉','にんじん 1/3本','ごはん 2膳','しょうゆ・酢・油 各適量'],steps:['鶏肉はそぎ切りにし、しょうゆ少々をからめる。','フライパンで両面を焼き、火を通す。','千切り野菜とごはんを添え、酢と油を合わせたたれをかける。'],nutrients:'たんぱく質・野菜・主食',alt:'豚薄切り肉'},
{name:'鮭とブロッコリーの蒸しごはん',protein:'魚',kind:'魚',foods:['鮭','ブロッコリー','玉ねぎ','ごはん'],time:25,recipe:['生鮭 2切れ','ブロッコリー 1/2株','玉ねぎ 1/2個','ごはん 2膳'],steps:['野菜を食べやすく切り、フライパンに広げる。','鮭をのせて水少々を加え、ふたをして蒸し焼きにする。','鮭に火が通ったらごはんと一緒に盛る。'],nutrients:'魚のたんぱく質・野菜・主食',alt:'鶏肉または豆腐'},
{name:'豆腐と彩り野菜のそぼろ丼',protein:'豆・豆腐',kind:'豆',foods:['豆腐','豚ひき肉','ピーマン','ごはん'],time:20,recipe:['木綿豆腐 1丁','豚ひき肉 120g','ピーマン 2個','ごはん 2膳','みそ・しょうゆ 各適量'],steps:['豆腐は水気を切り、ピーマンは細かく切る。','ひき肉とピーマンを炒め、豆腐をくずしながら加える。','みそとしょうゆで味を整え、ごはんにのせる。'],nutrients:'豆腐・肉のたんぱく質・野菜・主食',alt:'ひき肉を大豆ミートに'},
{name:'豚肉と根菜のしょうが炒め',protein:'豚肉',kind:'肉',foods:['豚肉','ごぼう','にんじん','ごはん'],time:25,recipe:['豚薄切り肉 180g','ごぼう 1/2本','にんじん 1/2本','ごはん 2膳','しょうが・しょうゆ 各適量'],steps:['根菜は薄切りにして、ごぼうは水にさっとさらす。','豚肉と根菜を炒め、火が通ったらしょうがとしょうゆで味付けする。','ごはんと盛り合わせる。'],nutrients:'肉のたんぱく質・根菜・主食',alt:'鶏肉'},

{name:'鶏ときのこの和風パスタ',protein:'鶏肉',kind:'鶏',foods:['鶏肉','しめじ','ほうれん草','パスタ'],time:25,recipe:['鶏もも肉 150g','しめじ 1/2袋','ほうれん草 1/3束','パスタ 160g','しょうゆ・油 各適量'],steps:['パスタを表示時間どおりゆでる。','鶏肉としめじを炒め、ほうれん草を加える。','ゆで汁少々、しょうゆとパスタを合わせる。'],nutrients:'鶏肉のたんぱく質・野菜・穀類',alt:'豆腐'},

{name:'野菜オムレツと全粒トースト',protein:'卵',kind:'卵',foods:['卵','ほうれん草','トマト','全粒パン'],time:15,recipe:['卵 3個','ほうれん草 1/3束','トマト 1個','全粒パン 2枚'],steps:['ほうれん草を刻んで軽く炒める。','溶き卵を加えて形を整え、弱火で火を通す。','トマトとトーストを添える。'],nutrients:'卵のたんぱく質・野菜・全粒穀物',alt:'豆腐入りスクランブル'}
];const breakfast=['納豆と野菜の朝ごはん','野菜オムレツと全粒トースト','卵と野菜のふんわり雑炊','ツナと豆のサラダサンド'];const lunch=['野菜たっぷり鶏うどん','豆腐と彩り野菜のそぼろ丼','ツナと豆のサラダサンド','レンズ豆と野菜のカレー'];function img(face,cls='mascot'){return `<img class="${cls}" src="${images[face]}" alt="MiniAyu" onerror="this.style.display='none'">`}function bubble(face,msg){return `<div class="question">${img(face)}<div class="bubble">${msg}</div></div>`}function checked(label,list){return list.includes(label)?'checked':''}function showToast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1900)}function setStep(n){state.step=n;render()}function header(face,msg,title,desc=''){return `${bubble(face,msg)}<h1 class="section-title">${title}</h1>${desc?`<p class="sub">${desc}</p>`:''}`}function buttons(back=true,next='次へ'){return `<div class="actions">${back?'<button class="btn ghost" data-back>戻る</button>':''}<button class="btn" data-next>${next}</button></div>`}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tokens(){return [state.allergy,state.cannot,state.avoid,state.dislike,state.softAvoid,state.rules].join(',').split(/[、,，\s]+/).filter(Boolean)}function blocked(food){return tokens().some(x=>x&&food.toLowerCase().includes(x.toLowerCase()))}function allowedPool(){let pool=foodPool.filter(x=>!x.foods.some(blocked)&&!blocked(x.name));const s=(state.style+' '+state.styleOther).toLowerCase();if(s.includes('ベジタリアン')||s.includes('植物性'))pool=pool.filter(x=>['豆','卵'].includes(x.kind));else if(s.includes('肉を食べない'))pool=pool.filter(x=>x.kind!=='肉'&&x.kind!=='鶏');if(s.includes('肉を食べる')&&!s.includes('魚')){}return pool.length?pool:foodPool.filter(x=>!x.foods.some(blocked))}function pickFor(day,meal,used,prev){let pool=allowedPool();if(meal==='朝食')pool=pool.filter(x=>breakfast.includes(x.name));if(meal==='昼食')pool=pool.filter(x=>lunch.includes(x.name));if(!pool.length)pool=allowedPool();const rank=x=>(used[x.kind]||0)*3+(x.kind===prev?2:0)+Math.random()*1.5-(state.love&&x.foods.join('').includes(state.love)?1:0)-(state.like&&x.foods.join('').includes(state.like)?0.4:0);pool.sort((a,b)=>rank(a)-rank(b));const p=pool[0]||foodPool[0];used[p.kind]=(used[p.kind]||0)+1;return {...p,day,meal,servings:state.people}}function generate(){const used={},menu=[],meals=state.meals.length?state.meals:['夕食'];let previous=state.past.find(Boolean)||'';for(let d=0;d<state.length;d++){for(const meal of meals){const item=pickFor(d,meal,used,previous);menu.push(item);previous=item.kind}}state.menu=menu;state.swapCount={};setStep(12)}function render(){badge.textContent=state.step===0?'MiniAyuといっしょ':`${Math.min(state.step,10)} / 10`;if(state.step===0){app.innerHTML=`<section class="panel hero">${img('hello')}<div class="bubble">こんにちは！<br>今週のごはんを一緒に考えよう♪</div><h1>今週のごはん、<br>バランスよく整えよう！</h1><p>あなたの好きなもの、苦手なもの、食生活に合わせて、1週間の献立を一緒に作ります。</p><button class="btn" data-start>献立を作る</button><div class="hint">入力内容はこのページ内だけで使い、保存・送信しません。</div></section>`;return}if(state.step===1){app.innerHTML=`<section class="panel">${header('suggest','まずは基本を教えてね！','何人分・何日分？')}<div class="field"><span class="label">まず、何人分のごはんを作る？</span><div class="choices">${['1人分','2人分','3人分','4人分','5人以上'].map(x=>`<label class="choice"><input type="radio" name="people" value="${x}" ${state.people===x?'checked':''}>${x}</label>`).join('')}</div></div><div class="field"><span class="label">何日分の献立を作ろうか？</span><div class="choices">${[1,3,7].map(x=>`<label class="choice"><input type="radio" name="length" value="${x}" ${state.length===x?'checked':''}>${x}日分 ${x===7?'<span class="tag">おすすめ</span>':''}</label>`).join('')}</div></div>${buttons()}</section>`;return}if(state.step===2){app.innerHTML=`<section class="panel">${header('suggest','いつもの生活に合わせて組み立てよう。','食事の条件','朝・昼・夜のどの食事を作るか、時間や予算も献立に反映するよ。')}<div class="field"><span class="label">作る食事</span><div class="choices">${['朝食','昼食','夕食'].map(x=>`<label class="choice"><input type="checkbox" name="meals" value="${x}" ${checked(x,state.meals)}>${x}</label>`).join('')}</div></div><div class="field"><label>調理にかけられる時間<select name="time">${['15分以内','30分以内','45分以内','時間はあまり気にしない'].map(x=>`<option ${state.time===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="grid"><div class="field"><label>1週間のおおよその食費（任意）<input class="input" name="budget" value="${safe(state.budget)}" placeholder="例：15,000円"></label></div><div class="field"><label>外食・テイクアウト予定（任意）<input class="input" name="eatingOut" value="${safe(state.eatingOut)}" placeholder="例：水曜の夕食"></label></div></div>${buttons()}</section>`;return}if(state.step===3){const allergens=['卵','乳','小麦','そば','落花生','えび','かに','くるみ'];app.innerHTML=`<section class="panel">${header('surprise','食べられないものや、アレルギーのある食材はあるかな？','アレルギー・食べられないもの','献立を考える前に確認する大切な項目です。')}<div class="field"><span class="label">アレルギー（食材を選択）</span><div class="grid">${allergens.map(x=>`<label class="choice"><input type="checkbox" name="allergyPick" value="${x}" ${checked(x,state.allergyPick)}>${x}</label>`).join('')}</div></div><div class="field"><label>アレルギー（自由入力）<input class="input" name="allergy" value="${safe(state.allergy)}" placeholder="例：キウイ、特定のナッツ"></label></div><div class="field"><label>食べられないもの<textarea name="cannot" placeholder="アレルギーとは別に、食べられないもの">${safe(state.cannot)}</textarea></label></div><div class="field"><label>避けたい食材<textarea name="avoid" placeholder="例：辛い食材">${safe(state.avoid)}</textarea></label></div><div class="note">アレルギーの安全性をアプリが判定することはありません。原材料表示や調理環境をご自身で必ずご確認ください。</div>${buttons()}</section>`;return}if(state.step===4){app.innerHTML=`<section class="panel">${header('relieved','わかったよ。好みも献立に反映するね！','好き嫌い・苦手な食材','「苦手」と「食べられない」は分けて考えるよ。')}<div class="field"><label>大好きな食材<input class="input" name="love" value="${safe(state.love)}" placeholder="例：トマト"></label></div><div class="field"><label>好きな食材<input class="input" name="like" value="${safe(state.like)}" placeholder="例：魚、豆腐"></label></div><div class="field"><label>苦手な食材<input class="input" name="dislike" value="${safe(state.dislike)}" placeholder="例：きのこ、青魚"></label></div><div class="field"><label>できれば避けたい食材<input class="input" name="softAvoid" value="${safe(state.softAvoid)}" placeholder="例：パクチー"></label></div>${buttons()}</section>`;return}if(state.step===5){app.innerHTML=`<section class="panel">${header('suggest','好みや暮らしのルールも教えてね。','食べ合わせ・食事上のルール')}<div class="field"><label>避けたい組み合わせや食事ルール<textarea name="rules" placeholder="例：特定の食材同士を組み合わせたくない、宗教・文化上避けているもの">${safe(state.rules)}</textarea></label><p class="hint">入力した個人的なルールとして扱います。医学的な安全性の判定はしません。</p></div>${buttons()}</section>`;return}if(state.step===6){const styles=['特に制限なし','肉を食べる','魚・シーフードを食べる','肉も魚も食べる','ベジタリアン','植物性食品を多めにしたい','その他'];app.innerHTML=`<section class="panel">${header('suggest','どんな食べ方が好き？','食事スタイル')}<div class="grid">${styles.map(x=>`<label class="choice"><input type="radio" name="style" value="${x}" ${state.style===x?'checked':''}>${x}</label>`).join('')}</div><div class="field"><label>補足（任意）<input class="input" name="styleOther" value="${safe(state.styleOther)}" placeholder="食事スタイルを自由に記入"></label></div>${buttons()}</section>`;return}if(state.step===7){app.innerHTML=`<section class="panel">${header('think','昨日は何を食べたかな？','昨日までの食事','直近のたんぱく質源を見て、似た料理が続かないように調整するね。')}<div class="field"><label>昨日<select name="past0"><option value="">特に指定しない</option>${['牛肉料理','豚肉料理','鶏肉料理','魚料理','豆腐・豆料理','卵料理','外食・その他'].map(x=>`<option ${state.past[0]===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="field"><label>一昨日<select name="past1"><option value="">特に指定しない</option>${['牛肉料理','豚肉料理','鶏肉料理','魚料理','豆腐・豆料理','卵料理','外食・その他'].map(x=>`<option ${state.past[1]===x?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="field"><label>3日前<select name="past2"><option value="">特に指定しない</option>${['牛肉料理','豚肉料理','鶏肉料理','魚料理','豆腐・豆料理','卵料理','外食・その他'].map(x=>`<option ${state.past[2]===x?'selected':''}>${x}</option>`).join('')}</select></label></div>${buttons(false,'献立を考える')}</section>`;return}if(state.step===11){const prev=state.past.find(Boolean)||'いつもの食事';app.innerHTML=`<section class="panel hero">${img('think')}<div class="bubble">${safe(prev)}を参考にしながら、<br>好みや食材の条件を見ているよ。</div><h1>献立を考えています……</h1><p>食べられない食材を避けて、食事スタイル・調理時間・1週間のバランスを組み合わせ中。</p><div class="progress"><span style="width:100%"></span></div></section>`;setTimeout(()=>{if(state.step===11){generate()}},650);return}if(state.step===12){renderPlan();return}if(state.step===13){renderShopping();return}if(state.step===14){const i=Number(state.recipeIndex),x=state.menu[i];if(!x){setStep(12);return}app.innerHTML=`<section class="panel"><button class="btn ghost small" data-plan>← 献立に戻る</button><h1 class="section-title" style="margin-top:15px">${safe(x.name)}</h1><div class="meta">${safe(x.servings)}・約${x.time}分・主なたんぱく質：${x.protein}</div><div class="recipe"><h4>材料（${safe(x.servings)}の目安）</h4><ul>${x.recipe.map(z=>`<li>${safe(z)}</li>`).join('')}</ul><h4>作り方</h4><ol>${x.steps.map(z=>`<li>${safe(z)}</li>`).join('')}</ol><h4>主な栄養要素</h4><p>${safe(x.nutrients)}</p><h4>代替食材のヒント</h4><p>${safe(x.alt)}（アレルギーがある場合は表示と調理環境を確認してください。）</p></div></section>`;return}app.innerHTML='';}
function renderPlan(){const meals=state.menu;const counts={};meals.forEach(x=>counts[x.kind]=(counts[x.kind]||0)+1);const max=Math.max(1,...Object.values(counts));const rows=['肉','鶏','魚','豆','卵'].map(k=>{const val=counts[k]||0;return `<div class="barrow"><span>${k==='鶏'?'鶏肉':k==='豆'?'豆・豆腐':k}</span><div class="track"><div class="fill" style="width:${Math.min(100,val/max*100)}%"></div></div><b>${val}</b></div>`}).join('');let advice=[];if(!(counts['魚']>0))advice.push('魚料理が少なめです。次回は魚を加えて変化をつけてもよさそう。');if(!(counts['豆']>0))advice.push('豆・豆腐料理を1回取り入れると、たんぱく質源の幅が広がります。');if(state.love)advice.push(`${safe(state.love)}を使った料理も選んだよ。`);if(state.budget)advice.push(`食費の目安「${safe(state.budget)}」を意識した、手に入りやすい食材中心の提案です。`);if(!advice.length)advice.push('いろいろな主なたんぱく質源を組み合わせました。野菜や果物は旬や手に入りやすさに合わせて足してね。');let cards='';for(let d=0;d<state.length;d++){const list=meals.map((x,i)=>({...x,i})).filter(x=>x.day===d);cards+=`<article class="day"><div class="dayhead"><h3>${days[d]||`${d+1}日目`}</h3><span class="tag">${list.length}食</span></div>${list.map(x=>`<div class="meal"><div><div class="meta">${x.meal}</div><div class="mealname">${safe(x.name)}</div><div class="meta">主な食材：${safe(x.foods.join('・'))}</div><div class="meta">主なたんぱく質：${safe(x.protein)}</div></div><span class="tag">約${x.time}分</span><div class="meal-actions"><button class="btn ghost small" data-recipe="${x.i}">レシピ詳細</button><button class="btn secondary small" data-swap="${x.i}">変更する</button></div></div>`).join('')}</article>`}app.innerHTML=`<section class="panel">${bubble('happy','できたよ！<br>今週もバランスよく食べよう♪')}<h1 class="section-title">今週の献立</h1><p class="sub">${state.people}・${state.length}日分。タップしてレシピを見たり、料理を変更できるよ。</p><div class="days">${cards}</div><div style="margin-top:22px"><h2 class="section-title">週間バランスの目安</h2><p class="hint">料理に含まれる主なたんぱく質源の回数です。栄養診断ではありません。</p><div class="bars">${rows}</div>${advice.map(a=>`<div class="note">${a}</div>`).join('')}</div><div class="actions"><button class="btn ghost" data-back>条件を見直す</button><button class="btn" data-shop>買い物リスト</button></div><section class="panel" style="box-shadow:none;margin-top:16px;background:#fbfaf4;text-align:center">${img('happy','mascot')}<p><b>完璧じゃなくても大丈夫。<br>いろいろな食材を楽しみながら、<br>無理なく続けていこうね♪</b></p><button class="btn secondary small" data-start>最初から作る</button></section></section>`}
function renderShopping(){const groups={'肉':/豚肉|鶏肉|牛肉|ひき肉/,'魚・シーフード':/鮭|さば|たら|ツナ/,'卵・乳製品':/卵|ヨーグルト/,'豆・豆腐':/豆腐|厚揚げ|納豆|豆|レンズ豆/,'野菜':/キャベツ|にんじん|ブロッコリー|玉ねぎ|ピーマン|ごぼう|小松菜|しめじ|ほうれん草|白菜|トマト|レタス|なす|じゃがいも/,'果物':/果物|レモン/,'穀類':/ごはん|パスタ|うどん|パン|全粒/,'調味料':/しょうゆ|みそ|油|だし|カレー粉|ごまだれ|酢|みりん|しょうが|塩/,'その他':/.*/};const items={};state.menu.forEach(x=>x.recipe.forEach(raw=>{const name=raw.replace(/\s*\d.*$/,'').trim();if(name&&!/各適量|適量|少々/.test(name))items[name]=(items[name]||0)+1}));const html=Object.entries(groups).map(([cat,re])=>{const arr=Object.entries(items).filter(([name])=>re.test(name));if(!arr.length)return '';return `<div class="shopping-group"><h3>${cat}</h3>${arr.map(([name,count])=>`<label class="shopitem"><input type="checkbox" data-item="${safe(name)}" ${state.checked[name]?'checked':''}><span>${safe(name)} <small class="meta">（${count}品のレシピに登場）</small></span></label>`).join('')}</div>`}).join('');app.innerHTML=`<section class="panel">${bubble('suggest','材料をまとめたよ。買えたものにチェックしてね！')}<h1 class="section-title">買い物リスト</h1><p class="sub">${state.length}日分の献立から食材をまとめています。分量はレシピを開いて確認してね。</p>${html||'<p>材料がありません。</p>'}<div class="actions"><button class="btn ghost" data-plan>献立に戻る</button><button class="btn secondary" data-print>印刷する</button></div></section>`}
function readForm(){const f=app;const val=(name)=>f.querySelector(`[name="${name}"]`)?.value??'';const checkeds=(name)=>[...f.querySelectorAll(`[name="${name}"]:checked`)].map(x=>x.value);if(state.step===1){state.people=val('people')||state.people;state.length=Number(val('length')||state.length)}if(state.step===2){state.meals=checkeds('meals');state.time=val('time');state.budget=val('budget');state.eatingOut=val('eatingOut')}if(state.step===3){state.allergy=val('allergy');state.allergyPick=checkeds('allergyPick');state.cannot=val('cannot');state.avoid=val('avoid')}if(state.step===4){state.love=val('love');state.like=val('like');state.dislike=val('dislike');state.softAvoid=val('softAvoid')}if(state.step===5)state.rules=val('rules');if(state.step===6){state.style=val('style')||state.style;state.styleOther=val('styleOther')}if(state.step===7)state.past=[val('past0'),val('past1'),val('past2')];}
app.addEventListener('change',e=>{if(e.target.name==='allergyPick')state.allergyPick=[...app.querySelectorAll('[name="allergyPick"]:checked')].map(x=>x.value);if(e.target.dataset.item)state.checked[e.target.dataset.item]=e.target.checked});app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-start')){setStep(1);return}if(b.hasAttribute('data-next')){readForm();if(state.step===7){generate();return}setStep(state.step+1);return}if(b.hasAttribute('data-back')){readForm();setStep(Math.max(1,state.step-1));return}if(b.dataset.recipe!==undefined){readForm();state.recipeIndex=Number(b.dataset.recipe);setStep(14);return}if(b.dataset.swap!==undefined){readForm();const i=Number(b.dataset.swap),old=state.menu[i],pool=allowedPool().filter(x=>x.kind!==old.kind||allowedPool().length<2);if(!pool.length){showToast('条件に合う代替候補が見つかりませんでした');return}const used={};state.menu.forEach((x,j)=>{if(j!==i)used[x.kind]=(used[x.kind]||0)+1});pool.sort((a,c)=>(used[a.kind]||0)-(used[c.kind]||0));const next=pool[(state.swapCount[i]||0)%Math.min(3,pool.length)];state.swapCount[i]=(state.swapCount[i]||0)+1;state.menu[i]={...next,day:old.day,meal:old.meal,servings:state.people};renderPlan();showToast('献立を入れ替えたよ');return}if(b.hasAttribute('data-shop')){setStep(13);return}if(b.hasAttribute('data-plan')){setStep(12);return}if(b.hasAttribute('data-print')){window.print()}});render();})();
</script></main></body></html>
